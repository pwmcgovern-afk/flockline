<!doctype html>
<html lang="en">

         on notched phones, so the bottom chrome clears the home indicator. -->

    <meta name="theme-color" content="#f4f2ed" />
    <meta
      name="description"
      content="Follow recent bird movement anywhere in the United States with live eBird sightings, regional filters, an interactive timeline, and field-ready insights."
    />
    <meta name="application-name" content="Flockline" />
    <meta name="apple-mobile-web-app-title" content="Flockline" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flockline" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Flockline · Live U.S. Bird Sightings" />
    <meta property="og:description" content="Follow recent bird movement anywhere in the United States with live eBird sightings, regional filters, an interactive timeline, and field-ready insights." />
    <meta property="og:url" content="https://flockline.app/" />
    <meta property="og:image" content="https://flockline.app/flockline-social-v2.jpg?v=20260818" />
    <meta property="og:image:secure_url" content="https://flockline.app/flockline-social-v2.jpg?v=20260818" />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://flockline.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <title>Flockline · Live U.S. Bird Sightings</title>
  </head>
  <body>
    <!-- On a slow connection the first ~1.7s were a blank paper-coloured
         window with nothing on it, which reads as a dead page rather than an
         app that is loading. React replaces this on its first render. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f2ed">
        <span style="font-family:Newsreader,Georgia,serif;font-style:italic;font-size:1.05rem;letter-spacing:.02em;color:#8b877e">
          flockline
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
